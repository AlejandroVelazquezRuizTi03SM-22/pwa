<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniStock PWA | Inventario UTSJR</title>
    
    <!-- MANIFIESTO -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1A237E"> 
    
    <!-- ESTILOS -->
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc, query, where, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // TUS CREDENCIALES REALES
        const firebaseConfig = {
          apiKey: "AIzaSyBDfQ1h_JzLtPvKxOk-m1XCVcER8L_so7U",
          authDomain: "unistock-pwa.firebaseapp.com",
          projectId: "unistock-pwa",
          storageBucket: "unistock-pwa.firebasestorage.app",
          messagingSenderId: "316393631480",
          appId: "1:316393631480:web:44084208a9051d71b6950d"
        };
        
        let db, auth;

        window.onload = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                window.db = db;
                window.auth = auth;
                window.firebase = { collection, getDocs, addDoc, doc, getDoc, updateDoc, query, where, orderBy, deleteDoc }; 
                
                await signInAnonymously(auth);
                console.log("✅ Conectado a Firebase");
                
                if (typeof window.initApp === 'function') window.initApp();

            } catch (error) {
                console.log("⚠️ Modo Offline activo");
                if (typeof window.initApp === 'function') window.initApp();
            }
        };
    </script>
</head>
<body>
    <header>
        <h1><img src="./images/utsjr_logo.png" alt="Logo" class="header-logo"> UniStock PWA</h1>
        <nav id="app-nav"></nav>
    </header>
    
    <!-- CAMBIO: El indicador ahora está AQUÍ, debajo del header -->
    <div id="connection-toast" class="toast hidden">🔴 Sin Conexión - Modo Offline</div>
    
    <main id="content">
        <div id="login-container">
            <h2>Acceso al Sistema</h2>
            <p>Selecciona tu perfil:</p>
            <button onclick="login('admin')">Acceso Almacén (Admin)</button>
            <button onclick="login('student')">Acceso Alumno</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 UTSJR | UniStock PWA</p>
    </footer>
    <script src="./js/app.js"></script>
</body>
</html>
